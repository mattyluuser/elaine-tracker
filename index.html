<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bothersome Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1>Elaine Bothersome Tracker</h1>

    <div class="count-wrap">
      <div id="count" class="count">0</div>
      <div class="count-label">bothersomes</div>
    </div>

    <label for="reporter-name" class="name-label">Your name</label>
    <input
      id="reporter-name"
      class="name-input"
      type="text"
      placeholder="Enter your name to log a bothersome"
      autocomplete="name"
    />

    <label for="reporter-description" class="name-label">What happened?</label>
    <textarea
      id="reporter-description"
      class="description-input"
      placeholder="Describe what she did (optional)"
      rows="2"
    ></textarea>

    <button id="bother-btn" class="bother-btn" aria-label="Log a bothersome moment" disabled>
      Elaine was bothersome
    </button>

    <section class="log">
      <h2>Log</h2>
      <ul id="log-list" class="log-list"></ul>
    </section>
  </main>

  <div id="remark-toast" class="remark-toast"></div>
  <div id="flood-layer" class="flood-layer" aria-hidden="true"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
