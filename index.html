<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christy's Chow Chow Gallery</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1>Christy's Chow Chow Gallery</h1>

    <div class="viewer">
      <div id="frame" class="frame">
        <img id="photo" class="photo" alt="A fluffy chow chow" hidden />
        <div id="status" class="status">Fetching chow chows&hellip;</div>
      </div>

      <button id="like-btn" class="like-btn" aria-label="Like this photo" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" class="heart-icon" aria-hidden="true">
          <path d="M12 21s-6.7-4.35-9.3-8.2C.8 10 1.2 6.4 4.1 4.6c2.3-1.4 5-0.8 6.6 1.2l1.3 1.6 1.3-1.6c1.6-2 4.3-2.6 6.6-1.2 2.9 1.8 3.3 5.4 1.4 8.2C18.7 16.65 12 21 12 21z"/>
        </svg>
      </button>
    </div>

    <div class="counter" id="counter">&nbsp;</div>

    <nav class="controls">
      <button id="prev-btn" class="nav-btn" aria-label="Previous photo" disabled>&#8249; Back</button>
      <button id="next-btn" class="nav-btn" aria-label="Next photo" disabled>Forward &#8250;</button>
    </nav>

    <p class="liked-count" id="liked-count"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
